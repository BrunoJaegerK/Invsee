name: Build InvseePM1E

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Invsee
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install Nukkit PetteriM1 Edition
        run: |
          git clone --depth 1 --branch release https://github.com/BrunoJaegerK/NukkitPetteriM1Edition.git ../NukkitPetteriM1Edition
          mvn -B -f ../NukkitPetteriM1Edition/pom.xml -DskipTests install

      - name: Download and install FakeInventories-1 PM1E
        run: |
          set -euo pipefail
          mkdir -p libs
          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/PetteriM1/FakeInventories-1/releases/latest)"
          DOWNLOAD_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "FakeInventories-1.1.8-PM1E-IWareQ.jar") | .browser_download_url' | head -n 1)"
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No se encontró el asset FakeInventories-1.1.8-PM1E-IWareQ.jar en el último release."
            exit 1
          fi
          curl -fL "$DOWNLOAD_URL" -o libs/FakeInventories-1.1.8-PM1E-IWareQ.jar
          mvn -B install:install-file \
            -Dfile=libs/FakeInventories-1.1.8-PM1E-IWareQ.jar \
            -DgroupId=me.iwareq \
            -DartifactId=fakeinventories-pm1e \
            -Dversion=1.1.8 \
            -Dpackaging=jar

      - name: Compile and package Invsee
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: InvseePM1E
          path: target/InvseePM1E.jar
          if-no-files-found: error
          retention-days: 14
